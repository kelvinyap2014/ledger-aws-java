# Server
server.port=8080

# H2 In-Memory Database Configuration
spring.datasource.url=jdbc:h2:mem:ledgerdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# Enable H2 Console for local test debugging
spring.h2.console.enabled=true

# JPA Configuration
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true

# Liquibase Configuration (H2 compliant changelog or same changelog with ANSI-standard SQL)
spring.liquibase.enabled=true
spring.liquibase.change-log=classpath:db/changelog/test.db.changelog-master.yaml

# Hibernate Caching—Disable for test isolation
spring.jpa.properties.hibernate.cache.use_second_level_cache=false
spring.jpa.properties.hibernate.cache.use_query_cache=false

# Connection Pool Configuration
spring.datasource.hikari.maximum-pool-size=2
spring.datasource.hikari.minimum-idle=1
